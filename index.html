<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeFlow </title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>">
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <style>
        :root {
            --primary: #214f3b;
            --primary-light: #7b9e85;
            --primary-dark: #183e2d;
            --bg: #f8f6f1;
            --surface: #ffffff;
            --text: #293c30;
            --text-light: #697b6e;
            --border: #e2e4dc;
            --shadow: rgba(28, 68, 46, 0.09);
            --error: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
        .header-bar { background: var(--primary-dark); color: white; padding: 1.25rem 2rem; font-size: 1.55rem; font-weight: 750; letter-spacing: -0.025em; }
        .main-content { padding: 1.5rem 2rem; max-width: 1280px; margin: 0 auto; }
        .recipe-toolbar { display: flex; align-items: stretch; gap: 0.75rem; margin-bottom: 1rem; }
        .recipe-toolbar .search-input { flex: 1; min-width: 0; margin-bottom: 0; }
        .recipe-toolbar .btn { white-space: nowrap; } .recipe-toolbar .keywords-toggle { margin-left: auto; }
        @media (max-width: 540px) { .recipe-toolbar { flex-direction: column; } .recipe-toolbar .btn { width: 100%; } .main-content { padding: 1rem; } }
        .search-input { width: 100%; padding: 1rem; border: 2px solid var(--border); border-radius: 12px; font-size: 1rem; margin-bottom: 1rem; }
        .status { color: var(--text-light); margin-bottom: 1rem; }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 999px; font-weight: 600; cursor: pointer; font-size: 0.92rem; transition: background 0.15s, box-shadow 0.15s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: white; color: var(--primary); border: 1px solid var(--border); } .btn-secondary:hover { background: #edf3ed; } .btn-primary:hover { background: var(--primary-dark); }
        .action-buttons { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
        .btn:disabled { opacity: 0.6; cursor: wait; }
        .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 1.5rem; }
        .recipe-card { background: var(--surface); border-radius: 16px; overflow: hidden; box-shadow: 0 3px 14px var(--shadow); cursor: pointer; border: 1px solid var(--border); transition: transform 0.15s, box-shadow 0.15s; }
        .recipe-card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px var(--shadow); } .recipe-image { width: 100%; height: 175px; object-fit: cover; background: linear-gradient(135deg, #2d8659, var(--primary)); }
        .recipe-content { padding: 1rem; }
        .recipe-name { font-size: 1.13rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 0.5rem; }
        .recipe-meta { font-size: 0.85rem; color: var(--text-light); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal { background: var(--surface); border-radius: 16px; padding: 2rem; max-width: 700px; max-height: 85vh; overflow-y: auto; width: 100%; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
        .ingredient-row { padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
        .step-row { margin-bottom: 0.75rem; }
        .input-group { margin-bottom: 1rem; }
        .input-label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.9rem; }
        .input-field { width: 100%; padding: 0.65rem; border: 2px solid var(--border); border-radius: 8px; font-size: 0.95rem; font-family: inherit; }
        textarea.input-field { min-height: 70px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .ing-row { display: grid; grid-template-columns: 1fr 2fr; gap: 0.5rem; margin-bottom: 0.5rem; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-right: 0.4rem; margin-bottom: 0.3rem; }
        .badge-primary { background: var(--primary-light); color: white; }
        .badge-accent { background: #e67e22; color: white; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1rem; background: var(--surface); padding: 0.85rem 1rem; border-radius: 14px; border: 1px solid var(--border); } .filter-bar .btn { border-radius: 999px; } .search-input:focus, .input-field:focus { outline: 2px solid #a4c3aa; outline-offset: 1px; }
        .badge-meal-planner { background: #e1eee4; color: #214f3b; border: 1px solid #b7d1bd; }
        .meal-planner-filter { margin: -0.25rem 0 1rem; }
        .meal-planner-filter .btn { padding: 0.45rem 0.95rem; font-size: 0.85rem; }
        .meal-planner-edit { display: flex; align-items: center; gap: 0.75rem; background: #edf4ed; padding: 0.9rem; border-radius: 12px; margin-bottom: 1rem; cursor: pointer; }
        .meal-planner-edit input { width: 18px; height: 18px; accent-color: var(--primary); }
        .meal-planner-edit small { display: block; color: var(--text-light); margin-top: 0.25rem; }
    </style>
</head>
<body>
    <div id="root">Loading...</div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const SUPABASE_URL = 'https://hebuaabantmnfdxxkaif.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_xzVfo0l-eLpkP4TuUy17KQ_kLLUUScF';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function App() {
            const [recipes, setRecipes] = useState([]);
            const [status, setStatus] = useState('loading');
            const [searchTerm, setSearchTerm] = useState('');
            const [viewingRecipe, setViewingRecipe] = useState(null);
            const [showFormModal, setShowFormModal] = useState(false);
            const [editingRecipe, setEditingRecipe] = useState(null);
            const [selectedCollections, setSelectedCollections] = useState([]);
            const [selectedKeywords, setSelectedKeywords] = useState([]);
            const [mealPlannerOnly, setMealPlannerOnly] = useState(false);
            const [filtersExpanded, setFiltersExpanded] = useState(false);
            const [showArchived, setShowArchived] = useState(false);
            const [archivePending, setArchivePending] = useState(false);

            const loadRecipes = () => {
                supabase.from('recipes').select('*').then((result) => {
                    if (result.error) {
                        setStatus('error: ' + result.error.message);
                    } else {
                        setRecipes(result.data);
                        setStatus('loaded');
                    }
                });
            };

            useEffect(() => { loadRecipes(); }, []);

            const visibleRecipes = recipes.filter((r) => Boolean(r.archived) === showArchived);
            const allCollections = [...new Set(visibleRecipes.flatMap((r) => (r.collections || []).filter((c) => c !== 'Macro')))].sort();
            const allKeywords = [...new Set(visibleRecipes.flatMap((r) => r.keywords || []))].sort();
            const toggleFilter = (value, setter) => setter((previous) => previous.includes(value) ? previous.filter((item) => item !== value) : [...previous, value]);

            const getCollectionCount = (collection) => visibleRecipes.filter((r) => r.collections && r.collections.includes(collection)).length;

            const filteredRecipes = visibleRecipes.filter((r) => {
                const query = searchTerm.trim().toLowerCase();
                const matchesSearch = !query ||
                    (r.name || '').toLowerCase().includes(query) ||
                    (r.keywords || []).some((k) => String(k).toLowerCase().includes(query)) ||
                    (r.ingredients || []).some((ingredient) =>
                        typeof ingredient === 'string'
                            ? ingredient.toLowerCase().includes(query)
                            : [ingredient?.item, ingredient?.amount].some((value) =>
                                String(value || '').toLowerCase().includes(query)
                            )
                    );
                const matchesCollection = selectedCollections.length === 0 ||
                    selectedCollections.some((collection) => (r.collections || []).includes(collection));
                const matchesKeyword = selectedKeywords.length === 0 ||
                    selectedKeywords.some((keyword) => (r.keywords || []).includes(keyword));
                return matchesSearch && matchesCollection && matchesKeyword && (!mealPlannerOnly || (r.collections || []).includes('Macro'));
            });

            const handleDelete = async (id) => {
                if (!confirm('Delete this recipe?')) return;
                await supabase.from('recipes').delete().eq('id', id);
                setViewingRecipe(null);
                loadRecipes();
            };

            const handleArchive = async (recipe) => {
                if (archivePending) return;
                setArchivePending(true);
                try {
                    const archived = !recipe.archived;
                    const { data, error } = await supabase.from('recipes')
                        .update({ archived }).eq('id', recipe.id).select('id, archived').single();
                    if (error) throw error;
                    setRecipes((current) => current.map((r) => r.id === data.id ? { ...r, archived: data.archived } : r));
                    setViewingRecipe(null);
                } catch (error) {
                    alert('Could not ' + (recipe.archived ? 'restore' : 'archive') + ' recipe: ' + error.message);
                } finally {
                    setArchivePending(false);
                }
            };

            const handleDuplicate = async (recipe) => {
                const copy = Object.assign({}, recipe);
                delete copy.id;
                delete copy.created_at;
                delete copy.updated_at;
                copy.name = recipe.name + ' (Copy)';
                const result = await supabase.from('recipes').insert(copy);
                if (result.error) { alert('Error: ' + result.error.message); return; }
                setViewingRecipe(null);
                loadRecipes();
            };

            const handleExport = () => {
                const dataStr = JSON.stringify(recipes, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'recipes-export.json';
                link.click();
            };

            const handleImport = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'application/json';
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    const text = await file.text();
                    try {
                        const importedRecipes = JSON.parse(text);
                        const existingNames = recipes.map((r) => r.name.toLowerCase().trim());
                        let added = 0;
                        let skipped = 0;
                        for (const r of importedRecipes) {
                            if (existingNames.includes((r.name || '').toLowerCase().trim())) {
                                skipped++;
                                continue;
                            }
                            const copy = Object.assign({}, r);
                            delete copy.id;
                            await supabase.from('recipes').insert(copy);
                            existingNames.push((r.name || '').toLowerCase().trim());
                            added++;
                        }
                        alert('Import complete: ' + added + ' added, ' + skipped + ' skipped (already existed)');
                        loadRecipes();
                    } catch (err) {
                        alert('Error importing recipes. Please check the file format.');
                    }
                };
                input.click();
            };

            const handlePasteImport = () => {
                const text = prompt('Paste your JSON text here:');
                if (!text) return;
                try {
                    const importedRecipes = JSON.parse(text);
                    (async () => {
                        const existingNames = recipes.map((r) => r.name.toLowerCase().trim());
                        let added = 0;
                        let skipped = 0;
                        for (const r of importedRecipes) {
                            if (existingNames.includes((r.name || '').toLowerCase().trim())) {
                                skipped++;
                                continue;
                            }
                            const copy = Object.assign({}, r);
                            delete copy.id;
                            await supabase.from('recipes').insert(copy);
                            existingNames.push((r.name || '').toLowerCase().trim());
                            added++;
                        }
                        alert('Import complete: ' + added + ' added, ' + skipped + ' skipped (already existed)');
                        loadRecipes();
                    })();
                } catch (err) {
                    alert('Error importing recipes. Please check the JSON format.');
                }
            };

            return (
                <div>
                    <div className="header-bar">🍳 RecipeFlow</div>
                    <div className="main-content">
                        {allCollections.length > 0 && (
                            <div className="filter-bar">
                                <span style={{ fontWeight: '600', marginRight: '0.5rem' }}>Collections:</span>
                                <button className={'btn ' + (selectedCollections.length === 0 ? 'btn-primary' : 'btn-secondary')}
                                    onClick={() => setSelectedCollections([])} style={{ padding: '0.4rem 0.9rem', fontSize: '0.85rem' }}>All ({visibleRecipes.length})</button>
                                {allCollections.map((collection) => (
                                    <button key={collection} aria-pressed={selectedCollections.includes(collection)}
                                        className={'btn ' + (selectedCollections.includes(collection) ? 'btn-primary' : 'btn-secondary')}
                                        onClick={() => toggleFilter(collection, setSelectedCollections)}
                                        style={{ padding: '0.4rem 0.9rem', fontSize: '0.85rem' }}>
                                        {collection} ({getCollectionCount(collection)})
                                    </button>
                                ))}
                            </div>
                        )}
                        <div className="meal-planner-filter">
                            <button className={'btn ' + (mealPlannerOnly ? 'btn-primary' : 'btn-secondary')} aria-pressed={mealPlannerOnly} onClick={() => setMealPlannerOnly(!mealPlannerOnly)}>
                                ✓ Meal Planner ({visibleRecipes.filter((r) => (r.collections || []).includes('Macro')).length})
                            </button>
                        </div>
                        <div className="recipe-toolbar">
                        <input
                            type="text"
                            className="search-input"
                            placeholder="Search recipe names, ingredients or keywords..."
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                        />
                        <button className="btn btn-primary" onClick={() => { setEditingRecipe(null); setShowFormModal(true); }}>+ Add Recipe</button>
                        <button className="btn btn-secondary keywords-toggle" onClick={() => setFiltersExpanded(!filtersExpanded)} aria-expanded={filtersExpanded}>
                            {filtersExpanded ? '▲ Hide keywords' : '☷ Keywords ▾'}{selectedKeywords.length > 0 ? ' (' + selectedKeywords.length + ')' : ''}
                        </button>
                        </div>
                        <div className="status">Status: {status} — showing {filteredRecipes.length} of {visibleRecipes.length} {showArchived ? 'archived' : 'active'} recipes</div>

                        <label style={{ display: 'flex', gap: '0.5rem', alignItems: 'center', marginBottom: '1rem', cursor: 'pointer' }}>
                            <input type="checkbox" checked={showArchived} onChange={(e) => {
                                setShowArchived(e.target.checked);
                                setSearchTerm('');
                                setSelectedCollections([]);
                                setSelectedKeywords([]);
                                setMealPlannerOnly(false);
                                setViewingRecipe(null);
                            }} />
                            Show archived recipes
                        </label>
                        {showArchived && <p style={{ marginBottom: '1rem' }}>Archived recipes are kept here. Open a recipe and choose Restore to return it to your collection.</p>}

                        {filtersExpanded && (
                            <React.Fragment>
                        {allKeywords.length > 0 && (
                            <div className="filter-bar">
                                <span style={{ fontWeight: '600', marginRight: '0.5rem' }}>Keywords:</span>
                                <button className={'btn ' + (selectedKeywords.length === 0 ? 'btn-primary' : 'btn-secondary')}
                                    onClick={() => setSelectedKeywords([])} style={{ padding: '0.4rem 0.9rem', fontSize: '0.85rem' }}>All</button>
                                {allKeywords.map((keyword) => (
                                    <button key={keyword} aria-pressed={selectedKeywords.includes(keyword)}
                                        className={'btn ' + (selectedKeywords.includes(keyword) ? 'btn-primary' : 'btn-secondary')}
                                        onClick={() => toggleFilter(keyword, setSelectedKeywords)}
                                        style={{ padding: '0.4rem 0.9rem', fontSize: '0.85rem' }}>{keyword}</button>
                                ))}
                            </div>
                        )}
                            </React.Fragment>
                        )}
                        <details style={{ marginBottom: '1rem' }}>
                            <summary style={{ cursor: 'pointer', color: 'var(--text-light)', fontSize: '0.9rem' }}>More options (Import / Export)</summary>
                            <div className="action-buttons" style={{ marginTop: '0.75rem' }}>
                                <button className="btn btn-secondary" onClick={handleImport}>📥 Import File</button>
                                <button className="btn btn-secondary" onClick={handlePasteImport}>📋 Paste JSON</button>
                                <button className="btn btn-secondary" onClick={handleExport}>📤 Export</button>
                            </div>
                        </details>
                        {(selectedCollections.length > 0 || selectedKeywords.length > 0 || mealPlannerOnly) && (
                            <div style={{ marginBottom: '1rem', display: 'flex', gap: '0.5rem', flexWrap: 'wrap', alignItems: 'center' }}>
                                <span style={{ color: 'var(--text-light)', fontSize: '0.85rem' }}>Active filters:</span>
                                {selectedCollections.map((collection) => (
                                    <button key={'collection-' + collection} className="badge badge-primary"
                                        onClick={() => toggleFilter(collection, setSelectedCollections)}>{collection} ✕</button>
                                ))}
                                {mealPlannerOnly && <button className="badge badge-meal-planner" onClick={() => setMealPlannerOnly(false)}>Meal Planner ✕</button>}
                                {selectedKeywords.map((keyword) => (
                                    <button key={'keyword-' + keyword} className="badge badge-accent"
                                        onClick={() => toggleFilter(keyword, setSelectedKeywords)}>{keyword} ✕</button>
                                ))}
                                <button className="btn btn-secondary" style={{ padding: '0.3rem 0.7rem', fontSize: '0.8rem' }}
                                    onClick={() => { setSelectedCollections([]); setSelectedKeywords([]); setMealPlannerOnly(false); }}>Clear filters</button>
                            </div>
                        )}

                        <div className="recipe-grid">
                            {filteredRecipes.map((recipe) => (
                                <div key={recipe.id} className="recipe-card" onClick={() => setViewingRecipe(recipe)}>
                                    {recipe.image_url ? (
                                        <img src={recipe.image_url} alt={recipe.name} className="recipe-image" />
                                    ) : (
                                        <div className="recipe-image"></div>
                                    )}
                                    <div className="recipe-content">
                                        <div className="recipe-name">{recipe.name}</div>
                                        <div className="recipe-meta">
                                            {recipe.nutrition && recipe.nutrition.calories ? recipe.nutrition.calories + ' cal' : ''}
                                        </div>
                                        {recipe.collections && recipe.collections.length > 0 && (
                                            <div style={{ marginTop: '0.5rem' }}>
                                                {recipe.collections.filter((col) => col !== 'Macro').map((col, idx) => (
                                                    <span key={idx} className="badge badge-primary">{col}</span>
                                                ))}
                                            </div>
                                        )}
                                        {(recipe.collections || []).includes('Macro') && <span className="badge badge-meal-planner">✓ Meal Planner</span>}
                                        {recipe.keywords && recipe.keywords.length > 0 && (
                                            <div style={{ marginTop: '0.4rem' }}>
                                                {recipe.keywords.map((keyword, idx) => (
                                                    <span
                                                        key={idx}
                                                        className="badge badge-accent"
                                                        onClick={(e) => { e.stopPropagation(); toggleFilter(keyword, setSelectedKeywords); }}
                                                        style={{ cursor: 'pointer' }}
                                                        title={'Filter by ' + keyword}
                                                    >
                                                        🔍 {keyword}
                                                    </span>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                        {status === 'loaded' && filteredRecipes.length === 0 && (
                            <p style={{ marginTop: '1rem' }}>{showArchived ? 'No archived recipes match this view.' : 'No recipes match this view.'}</p>
                        )}
                    </div>

                    {viewingRecipe && (
                        <RecipeDetail
                            recipe={viewingRecipe}
                            onClose={() => setViewingRecipe(null)}
                            onEdit={() => { setEditingRecipe(viewingRecipe); setViewingRecipe(null); setShowFormModal(true); }}
                            onDelete={() => handleDelete(viewingRecipe.id)}
                            onDuplicate={() => handleDuplicate(viewingRecipe)}
                            onArchive={() => handleArchive(viewingRecipe)}
                            archivePending={archivePending}
                        />
                    )}

                    {showFormModal && (
                        <RecipeForm
                            recipe={editingRecipe}
                            onClose={() => setShowFormModal(false)}
                            onSave={loadRecipes}
                        />
                    )}
                </div>
            );
        }

        function RecipeDetail({ recipe, onClose, onEdit, onDelete, onDuplicate, onArchive, archivePending }) {
            const ingredients = Array.isArray(recipe.ingredients) ? recipe.ingredients.filter(ing => ing && (ing.item || ing.amount)) : [];
            const steps = Array.isArray(recipe.steps) ? recipe.steps.filter(step => typeof step === 'string' && step.trim()) : [];
            const nutrition = recipe.nutrition || {};
            const nutritionFields = [
                ['Calories', 'calories', 'kcal'], ['Protein', 'protein', 'g'],
                ['Carbs', 'carbs', 'g'], ['Fat', 'fat', 'g']
            ].filter(([, key]) => nutrition[key] !== null && nutrition[key] !== undefined && nutrition[key] !== '');
            const hasTime = recipe.prep_time || recipe.cook_time;
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <h2>{recipe.name}</h2>
                            <button className="close-btn" onClick={onClose}>✕</button>
                        </div>

                        {recipe.image_url && (
                            <img src={recipe.image_url} alt={recipe.name} style={{ width: '160px', maxWidth: '45%', maxHeight: '130px', objectFit: 'cover', borderRadius: '8px', marginBottom: '1rem', display: 'block' }} />
                        )}

                        {(recipe.collections || []).includes('Macro') && <div style={{marginBottom:'1rem'}}><span className="badge badge-meal-planner">✓ Meal Planner</span></div>}
                        {(recipe.servings || hasTime) && (
                            <div style={{ display: 'flex', gap: '0.75rem', flexWrap: 'wrap', marginBottom: '1.25rem' }}>
                                {recipe.servings ? <span><strong>Serves:</strong> {recipe.servings}</span> : null}
                                {recipe.prep_time ? <span><strong>Prep:</strong> {recipe.prep_time} min</span> : null}
                                {recipe.cook_time ? <span><strong>Cook:</strong> {recipe.cook_time} min</span> : null}
                            </div>
                        )}

                        {ingredients.length > 0 && (
                            <div style={{ marginBottom: '1.5rem' }}>
                                <h3 style={{ marginBottom: '0.5rem' }}>Ingredients</h3>
                                {ingredients.map((ing, idx) => (
                                    <div key={idx} className="ingredient-row">
                                        {ing.amount && <strong>{ing.amount} </strong>}{ing.item}
                                    </div>
                                ))}
                            </div>
                        )}

                        {steps.length > 0 && (
                            <div style={{ marginBottom: '1.5rem' }}>
                                <h3 style={{ marginBottom: '0.5rem' }}>Method</h3>
                                {steps.map((step, idx) => (
                                    <div key={idx} className="step-row">{idx + 1}. {step}</div>
                                ))}
                            </div>
                        )}

                        {recipe.notes && recipe.notes.trim() && (
                            <div style={{ marginBottom: '1.5rem' }}>
                                <h3 style={{ marginBottom: '0.5rem' }}>My Notes</h3>
                                <div style={{ whiteSpace: 'pre-wrap' }}>{recipe.notes}</div>
                            </div>
                        )}

                        {nutritionFields.length > 0 && (
                            <div style={{ marginBottom: '1.5rem' }}>
                                <h3 style={{ marginBottom: '0.5rem' }}>Nutrition – My Portion</h3>
                                <div style={{ display: 'flex', gap: '1rem', flexWrap: 'wrap' }}>
                                    {nutritionFields.map(([label, key, unit]) => (
                                        <span key={key}><strong>{label}:</strong> {nutrition[key]} {unit}</span>
                                    ))}
                                </div>
                            </div>
                        )}

                        {recipe.source && <div style={{ marginBottom: '0.5rem' }}><strong>Source:</strong> {recipe.source}</div>}
                        {Array.isArray(recipe.collections) && recipe.collections.length > 0 && <div style={{ marginBottom: '0.5rem' }}><strong>Collections:</strong> {recipe.collections.join(', ')}</div>}
                        {Array.isArray(recipe.keywords) && recipe.keywords.length > 0 && <div style={{ marginBottom: '1rem' }}><strong>Keywords:</strong> {recipe.keywords.join(', ')}</div>}

                        <div className="action-buttons" style={{ marginBottom: 0, flexWrap: 'wrap' }}>
                            <button className="btn btn-secondary" onClick={onArchive} disabled={archivePending}>
                                {archivePending ? 'Saving…' : recipe.archived ? '↩️ Restore' : '📦 Archive'}
                            </button>
                            <button className="btn btn-primary" onClick={onEdit}>✏️ Edit</button>
                            <button className="btn btn-secondary" onClick={onDuplicate}>📋 Duplicate</button>
                            <button className="btn btn-secondary" onClick={onDelete} style={{ background: 'var(--error)', color: 'white', border: 'none' }}>🗑️ Delete</button>
                        </div>
                    </div>
                </div>
            );
        }

        function RecipeForm({ recipe, onClose, onSave }) {
            const [formData, setFormData] = useState(recipe ? { ...recipe, nutrition: recipe.nutrition || {} } : {
                name: '', servings: 1, prep_time: null, cook_time: null, source: '', image_url: '',
                collections: [], keywords: [], ingredients: [], steps: [], notes: '',
                nutrition: { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, sugar: 0, salt: 0 },
                is_simple: false
            });

            const updateIngredient = (idx, field, value) => {
                const newIngs = [...formData.ingredients];
                newIngs[idx] = { ...newIngs[idx], [field]: value };
                setFormData({ ...formData, ingredients: newIngs });
            };

            const addIngredient = () => {
                setFormData({ ...formData, ingredients: [...formData.ingredients, { item: '', amount: '' }] });
            };

            const updateStep = (idx, value) => {
                const newSteps = [...formData.steps];
                newSteps[idx] = value;
                setFormData({ ...formData, steps: newSteps });
            };

            const addStep = () => {
                setFormData({ ...formData, steps: [...formData.steps, ''] });
            };

            const handleSave = async () => {
                if (!formData.name) { alert('Please enter a recipe name'); return; }

                const sanitizedData = {
                    name: formData.name,
                    servings: parseInt(formData.servings) || 1,
                    prep_time: formData.prep_time ? parseInt(formData.prep_time) : null,
                    cook_time: formData.cook_time ? parseInt(formData.cook_time) : null,
                    source: formData.source || '',
                    image_url: formData.image_url || '',
                    collections: Array.isArray(formData.collections) ? formData.collections : [],
                    keywords: Array.isArray(formData.keywords) ? formData.keywords : [],
                    ingredients: Array.isArray(formData.ingredients) ? formData.ingredients : [],
                    steps: Array.isArray(formData.steps) ? formData.steps : [],
                    notes: formData.notes || '',
                    nutrition: Object.values(formData.nutrition || {}).some((value) => value !== '' && value !== null && value !== undefined)
                        ? Object.fromEntries(Object.entries(formData.nutrition).filter(([, value]) => value !== '' && value !== null && value !== undefined).map(([key, value]) => [key, Number(value)]))
                        : null,
                    is_simple: Boolean(formData.is_simple)
                };

                if (recipe) {
                    const result = await supabase.from('recipes').update(sanitizedData).eq('id', recipe.id);
                    if (result.error) { alert('Error: ' + result.error.message); return; }
                } else {
                    const result = await supabase.from('recipes').insert(sanitizedData);
                    if (result.error) { alert('Error: ' + result.error.message); return; }
                }

                onSave();
                onClose();
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <h2>{recipe ? 'Edit Recipe' : 'Add Recipe'}</h2>
                            <button className="close-btn" onClick={onClose}>✕</button>
                        </div>

                        <div className="form-row">
                            <div className="input-group">
                                <label className="input-label">Recipe Name *</label>
                                <input className="input-field" value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} />
                            </div>
                            <div className="input-group">
                                <label className="input-label">Servings</label>
                                <input type="number" className="input-field" value={formData.servings} onChange={(e) => setFormData({ ...formData, servings: e.target.value })} />
                            </div>
                        </div>

                        <div className="form-row">
                            <div className="input-group">
                                <label className="input-label">Prep Time (min)</label>
                                <input type="number" className="input-field" value={formData.prep_time || ''} onChange={(e) => setFormData({ ...formData, prep_time: e.target.value })} />
                            </div>
                            <div className="input-group">
                                <label className="input-label">Cook Time (min)</label>
                                <input type="number" className="input-field" value={formData.cook_time || ''} onChange={(e) => setFormData({ ...formData, cook_time: e.target.value })} />
                            </div>
                        </div>

                        <div className="input-group">
                            <label className="input-label">Image URL</label>
                            <input className="input-field" value={formData.image_url} onChange={(e) => setFormData({ ...formData, image_url: e.target.value })} />
                        </div>

                        <div className="input-group">
                            <label className="input-label">Source</label>
                            <input className="input-field" value={formData.source} onChange={(e) => setFormData({ ...formData, source: e.target.value })} />
                        </div>

                        <div className="input-group">
                            <label className="input-label">Collections (comma-separated)</label>
                            <input className="input-field" value={(formData.collections || []).filter((c) => c !== 'Macro').join(', ')} onChange={(e) => setFormData({ ...formData, collections: [...e.target.value.split(',').map((s) => s.trim()).filter((s) => s && s !== 'Macro'), ...((formData.collections || []).includes('Macro') ? ['Macro'] : [])] })} />
                        </div>

                        <label className="meal-planner-edit">
                            <input type="checkbox" checked={(formData.collections || []).includes('Macro')} onChange={(e) => setFormData({ ...formData, collections: e.target.checked ? [...(formData.collections || []).filter((c) => c !== 'Macro'), 'Macro'] : (formData.collections || []).filter((c) => c !== 'Macro') })} />
                            <span><strong>Included in Meal Planner</strong><small>Tick when this recipe is on your meal planner spreadsheet.</small></span>
                        </label>

                        <div className="input-group">
                            <label className="input-label">Keywords (comma-separated)</label>
                            <input className="input-field" value={(formData.keywords || []).join(', ')} onChange={(e) => setFormData({ ...formData, keywords: e.target.value.split(',').map((s) => s.trim()).filter(Boolean) })} />
                        </div>

                        <h3 style={{ marginBottom: '0.75rem' }}>Nutrition (per serving)</h3>
                        <div className="form-row">
                            <div className="input-group">
                                <label className="input-label">Calories</label>
                                <input type="number" className="input-field" value={formData.nutrition.calories ?? ''} onChange={(e) => setFormData({ ...formData, nutrition: { ...formData.nutrition, calories: e.target.value } })} />
                            </div>
                            <div className="input-group">
                                <label className="input-label">Protein (g)</label>
                                <input type="number" className="input-field" value={formData.nutrition.protein ?? ''} onChange={(e) => setFormData({ ...formData, nutrition: { ...formData.nutrition, protein: e.target.value } })} />
                            </div>
                        </div>
                        <div className="form-row">
                            <div className="input-group">
                                <label className="input-label">Carbs (g)</label>
                                <input type="number" className="input-field" value={formData.nutrition.carbs ?? ''} onChange={(e) => setFormData({ ...formData, nutrition: { ...formData.nutrition, carbs: e.target.value } })} />
                            </div>
                            <div className="input-group">
                                <label className="input-label">Fat (g)</label>
                                <input type="number" className="input-field" value={formData.nutrition.fat ?? ''} onChange={(e) => setFormData({ ...formData, nutrition: { ...formData.nutrition, fat: e.target.value } })} />
                            </div>
                        </div>

                        <h3 style={{ marginBottom: '0.75rem' }}>Ingredients</h3>
                        {formData.ingredients.map((ing, idx) => (
                            <div key={idx} className="ing-row">
                                <input className="input-field" placeholder="Amount" value={ing.amount} onChange={(e) => updateIngredient(idx, 'amount', e.target.value)} />
                                <input className="input-field" placeholder="Item" value={ing.item} onChange={(e) => updateIngredient(idx, 'item', e.target.value)} />
                            </div>
                        ))}
                        <button className="btn btn-secondary" onClick={addIngredient} style={{ marginBottom: '1.5rem' }}>+ Add Ingredient</button>

                        <h3 style={{ marginBottom: '0.75rem' }}>Steps</h3>
                        {formData.steps.map((step, idx) => (
                            <div key={idx} className="input-group">
                                <textarea className="input-field" placeholder={'Step ' + (idx + 1)} value={step} onChange={(e) => updateStep(idx, e.target.value)} />
                            </div>
                        ))}
                        <button className="btn btn-secondary" onClick={addStep} style={{ marginBottom: '1.5rem' }}>+ Add Step</button>

                        <div className="input-group">
                            <label className="input-label">Notes</label>
                            <textarea className="input-field" value={formData.notes} onChange={(e) => setFormData({ ...formData, notes: e.target.value })} />
                        </div>

                        <div className="action-buttons" style={{ marginBottom: 0 }}>
                            <button className="btn btn-primary" onClick={handleSave}>Save Recipe</button>
                            <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
